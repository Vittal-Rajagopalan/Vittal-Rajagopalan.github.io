<style>
/* ===== COLORS (change these to restyle the whole page) ===== */
:root{

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
main{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 60px}
a{color:var(--acc)} button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{padding:56px 0 24px;border-bottom:2px solid var(--ink)}
h1{font:800 clamp(2.2rem,7vw,4.2rem)/1 var(--disp);letter-spacing:-.03em;margin:0 0 12px}
.tag{font-size:1.1rem;margin:0 0 14px;max-width:36em}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 .95rem var(--disp)}
h2{font:700 1.3rem var(--disp);margin:36px 0 12px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 10px}
.grp b{font:600 .9rem var(--disp);min-width:9em}
.chip{font:.9rem var(--disp);border:1.5px solid var(--ink);padding:2px 10px;border-radius:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.filters button{font:500 .9rem var(--disp);background:none;border:1.5px solid var(--ink);border-radius:2px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px;margin-top:16px}
.card{border:1.5px solid var(--ink);background:var(--panel);display:flex;flex-direction:column}
.main{aspect-ratio:16/10;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 10px,var(--panel) 10px,var(--panel) 20px);display:grid;place-items:center;overflow:hidden;border-bottom:1.5px solid var(--ink);color:var(--mute);font:.9rem var(--disp)}
.main img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs{display:flex;gap:6px;padding:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.thumbs:empty{display:none}
.th{width:64px;height:44px;padding:0;border:2px solid transparent;background:none;cursor:pointer;flex:none}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th.on{border-color:var(--acc)}
.body{padding:12px 14px 14px}
.body h3{font:700 1.2rem/1.2 var(--disp);margin:0 0 4px}
.sum{margin:0 0 8px;font-size:.95rem;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font:.82rem var(--disp)}
.meta b{color:var(--mute);font-weight:500;margin-right:4px}
details{margin-top:8px;font-size:.92rem}
summary{font:600 .85rem var(--disp);cursor:pointer}
details ul{margin:6px 0 0;padding-left:1.1em}
footer{border-top:2px solid var(--ink);margin-top:40px;padding-top:16px;color:var(--mute);font-size:.9rem}
</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");
let filter = "all";
const shown = {};                       // which image is showing per project
function card(p, i) {
  const n = p.images.length;
  const k = n ? Math.min(shown[i] || 0, n - 1) : 0;
  const imageFit = p.imageFit || "contain";
  const imagePosition = p.imagePosition || "center center";

  const main = n
    ? `<img src="${esc(p.images[k])}" alt="${esc(p.title)}" style="object-fit:${esc(imageFit)};object-position:${esc(imagePosition)}">`
    : `<span>Photos coming soon</span>`;

  const thumbs = n > 1
    ? p.images.map((s, j) =>
        `<button class="th ${j === k ? "on" : ""}" data-p="${i}" data-j="${j}" aria-label="Show image ${j + 1}">
          <img src="${esc(s)}" alt="">
        </button>`
      ).join("")
    : "";

  const meta = [
    ["Role", p.role],
    ["Part of", p.affiliation],
    ["Tools", p.tools],
    ["Status", p.status]
  ].filter(m => m[1])
   .map(m => `<span><b>${m[0]}</b>${esc(m[1])}</span>`)
   .join("");

  const det = p.details.length
    ? `<details open><summary>Details</summary><ul>${p.details.map(d => `<li>${esc(d)}</li>`).join("")}</ul></details>`
    : "";

  const link = p.link
    ? `<p><a href="${esc(p.link)}" target="_blank" rel="noopener">View project</a></p>`
    : "";

  return `<article class="card">
    <div class="main">${main}</div>
    <div class="thumbs">${thumbs}</div>
    <div class="body">
      <h3>${esc(p.title)}</h3>
      ${p.summary ? `<p class="sum">${esc(p.summary)}</p>` : ""}
      <div class="meta">${meta}</div>
      ${det}
      ${link}
    </div>
  </article>`;
}

function render() {
  const list = PROJECTS.map((p, i) => ({ p, i })).filter(x => !x.p.hidden);
  const cats = [...new Set(list.map(x => x.p.category).filter(Boolean))];
  if (filter !== "all" && !cats.includes(filter)) filter = "all";
  const links = SITE.links.filter(l => l.url).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  const skills = SKILLS.map(g => `<div class="grp"><b>${esc(g.group)}</b>${g.items.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>`).join("");
  const filters = ["all", ...cats].map(c => `<button aria-pressed="${c === filter}" data-f="${esc(c)}">${c === "all" ? "All" : esc(c)}</button>`).join("");
  app.innerHTML = `<header><h1>${esc(SITE.name)}</h1><p class="tag">${esc(SITE.tagline)}</p><div class="links">${links}</div></header>
    <h2>Skills</h2>${skills}
    <h2>Projects</h2><div class="filters" role="group" aria-label="Filter projects">${filters}</div>
    <div class="grid">${list.filter(x => filter === "all" || x.p.category === filter).map(x => card(x.p, x.i)).join("")}</div>
    <footer>${esc(SITE.footer)}</footer>`;
}

app.addEventListener("click", e => {
  const f = e.target.closest("[data-f]"), t = e.target.closest("[data-j]");
  if (f) { filter = f.dataset.f; render(); }
  if (t) { shown[t.dataset.p] = +t.dataset.j; render(); }
});
document.title = SITE.name + " – Engineering Portfolio";
render();
</script>
